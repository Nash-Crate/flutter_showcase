name: flutter_showcase
description: "A Flutter project that showcases all the skills"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ">=3.11.5 <=4.0.0"
  flutter: ">=3.41.7 <=4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # authentication
  google_sign_in: ^7.2.0

  # caching
  shared_preferences: ^2.5.5

  # DI
  get_it: ^9.2.1
  injectable: ^3.0.0

  # functional
  fpdart: ^1.2.0

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  slang: ^4.14.0
  slang_flutter: ^4.14.0

  # network
  dio: ^5.9.2
  internet_connection_checker_plus: ^2.9.1+2

  # payments
  purchases_flutter: ^10.0.1
  purchases_ui_flutter: ^10.0.1

  # routing
  go_router: ^17.2.2

  # state management
  flutter_bloc: ^9.1.1

  # supabase
  supabase_flutter: ^2.12.4

  # UI
  cupertino_icons: ^1.0.9
  google_fonts: ^8.0.2
  flutter_screenutil: ^5.9.3

  # UI components
  skeletonizer: ^2.1.3
  toastification: ^3.2.0
  video_player: ^2.11.1

  # utils
  collection: ^1.19.1
  fast_immutable_collections: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  logger: ^2.7.0
  package_info_plus: ^10.1.0
  uuid: ^4.5.3

dev_dependencies:
  # code analyzers
  very_good_analysis: ^10.2.0

  # generators
  build_runner: ^2.14.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.1
  go_router_builder: ^4.3.0

  # testing
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mockito: ^5.6.4

